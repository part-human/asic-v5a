
name: Build R6700v2 ASIC V5-A TX1024 TXBUDGET16

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget

      - name: Clone OpenWrt 25.12.5
        run: |
          git clone --depth 1 --branch v25.12.5 \
            https://github.com/openwrt/openwrt.git

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure competitive packages
        working-directory: openwrt
        run: |
          set -eu
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_netgear_r6700-v2=y

          CONFIG_PACKAGE_tc-full=y
          CONFIG_PACKAGE_kmod-sched-core=y
          CONFIG_PACKAGE_kmod-sched=y
          CONFIG_PACKAGE_kmod-sched-ctinfo=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-netem=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-sched-red=y
          CONFIG_PACKAGE_kmod-sched-pie=y
          CONFIG_PACKAGE_kmod-sched-fq-pie=y
          CONFIG_PACKAGE_kmod-sched-flower=y
          CONFIG_PACKAGE_kmod-sched-act-police=y
          CONFIG_PACKAGE_kmod-sched-connmark=y

          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ethtool-full=y
          CONFIG_PACKAGE_conntrack=y
          CONFIG_PACKAGE_jq=y
          CONFIG_PACKAGE_coreutils-sleep=y
          CONFIG_PACKAGE_lua=y
          EOF

          make defconfig

          for pkg in \
            tc-full kmod-sched-core kmod-sched \
            kmod-sched-ctinfo kmod-ifb kmod-veth \
            kmod-netem kmod-sched-cake kmod-sched-red \
            kmod-sched-pie kmod-sched-fq-pie \
            kmod-sched-flower kmod-sched-act-police \
            kmod-sched-connmark ip-full ethtool-full \
            conntrack jq coreutils-sleep lua
          do
            grep -qx "CONFIG_PACKAGE_${pkg}=y" .config || {
              echo "Missing required package: $pkg"
              exit 1
            }
          done

      - name: Configure HZ1000 and PREEMPT
        working-directory: openwrt
        run: |
          set -eu
          KCONFIG=target/linux/generic/config-6.12

          grep -qx 'CONFIG_HZ=100' "$KCONFIG"
          grep -qx 'CONFIG_HZ_100=y' "$KCONFIG"
          grep -qx '# CONFIG_HZ_1000 is not set' "$KCONFIG"

          sed -i \
            -e 's/^CONFIG_HZ=100$/CONFIG_HZ=1000/' \
            -e 's/^CONFIG_HZ_100=y$/# CONFIG_HZ_100 is not set/' \
            -e 's/^# CONFIG_HZ_1000 is not set$/CONFIG_HZ_1000=y/' \
            "$KCONFIG"

          sed -i \
            -e '/^CONFIG_PREEMPT_NONE=/d' \
            -e '/^# CONFIG_PREEMPT_NONE is not set$/d' \
            -e '/^CONFIG_PREEMPT_VOLUNTARY=/d' \
            -e '/^# CONFIG_PREEMPT_VOLUNTARY is not set$/d' \
            -e '/^CONFIG_PREEMPT=/d' \
            -e '/^# CONFIG_PREEMPT is not set$/d' \
            "$KCONFIG"

          cat >> "$KCONFIG" <<'EOF'

          # ASIC V5-A preemption
          # CONFIG_PREEMPT_NONE is not set
          # CONFIG_PREEMPT_VOLUNTARY is not set
          CONFIG_PREEMPT=y
          EOF

          grep -qx 'CONFIG_HZ=1000' "$KCONFIG"
          grep -qx 'CONFIG_HZ_1000=y' "$KCONFIG"
          grep -qx 'CONFIG_PREEMPT=y' "$KCONFIG"

          git diff -- "$KCONFIG"

      - name: Prepare MT7621 kernel source
        working-directory: openwrt
        run: |
          make target/linux/prepare V=s

      - name: Apply ASIC V5-A Ethernet modifications
        working-directory: openwrt
        run: |
          set -eu

          DRIVER="$(find build_dir/target-* \
            -type f \
            -path '*/drivers/net/ethernet/mediatek/mtk_eth_soc.c' \
            -print -quit)"

          HDR="$(find build_dir/target-* \
            -type f \
            -path '*/drivers/net/ethernet/mediatek/mtk_eth_soc.h' \
            -print -quit)"

          test -n "$DRIVER"
          test -n "$HDR"
          test -f "$DRIVER"
          test -f "$HDR"

          python3 - "$DRIVER" "$HDR" <<'PY'
          import re
          import sys

          driver_path, header_path = sys.argv[1:3]

          with open(driver_path, encoding="utf-8") as f:
              data = f.read()

          with open(header_path, encoding="utf-8") as f:
              hdr = f.read()

          # ---------------------------------------
          # MT7621 ring sizes
          # ---------------------------------------
          soc = re.search(
              r"static const struct mtk_soc_data mt7621_data = \{.*?\n\};",
              data,
              re.S,
          )
          if not soc:
              raise SystemExit("MT7621 SoC data missing")

          block = soc.group(0)

          def ring_value(text, pattern):
              m = re.search(pattern, text, re.S)
              return m.group(1) if m else None

          tx_pattern = (
              r"\.tx\s*=\s*\{.*?\.dma_size\s*="
              r"\s*MTK_DMA_SIZE\(([^)]+)\)"
          )
          fq_pattern = (
              r"\.tx\s*=\s*\{.*?\.fq_dma_size\s*="
              r"\s*MTK_DMA_SIZE\(([^)]+)\)"
          )
          rx_pattern = (
              r"\.rx\s*=\s*\{.*?\.dma_size\s*="
              r"\s*MTK_DMA_SIZE\(([^)]+)\)"
          )

          before = (
              ring_value(block, tx_pattern),
              ring_value(block, fq_pattern),
              ring_value(block, rx_pattern),
          )

          if before != ("2K", "2K", "512"):
              raise SystemExit(
                  f"Unexpected stock rings: {before}"
              )

          patched, count = re.subn(
              r"(\.tx\s*=\s*\{.*?\.dma_size\s*=\s*)"
              r"MTK_DMA_SIZE\(2K\)",
              r"\1MTK_DMA_SIZE(1K)",
              block,
              count=1,
              flags=re.S,
          )

          if count != 1:
              raise SystemExit("TX ring patch failed")

          after = (
              ring_value(patched, tx_pattern),
              ring_value(patched, fq_pattern),
              ring_value(patched, rx_pattern),
          )

          if after != ("1K", "2K", "512"):
              raise SystemExit(
                  f"Incorrect patched rings: {after}"
              )

          data = (
              data[:soc.start()]
              + patched
              + data[soc.end():]
          )

          # ---------------------------------------
          # TX completion interrupt INT0
          # ---------------------------------------
          hdr, count = re.subn(
              r"^(#define\s+MTK_TX_DONE_INT\s+)"
              r"MTK_TX_DONE_DLY\s*$",
              r"\1MTK_TX_DONE_INT0",
              hdr,
              count=1,
              flags=re.M,
          )

          if count != 1:
              raise SystemExit(
                  "TX interrupt INT0 patch failed"
              )

          # ---------------------------------------
          # TX NAPI completion budget 16
          # ---------------------------------------
          fn = re.search(
              r"static int mtk_napi_tx"
              r"\(struct napi_struct \*napi, int budget\)"
              r"\n\{.*?\n\}",
              data,
              re.S,
          )

          if not fn:
              raise SystemExit("mtk_napi_tx missing")

          original = fn.group(0)

          updated, c1 = re.subn(
              r"(\n\s*int tx_done = 0;)",
              r"\1\n\tint tx_budget = min(budget, 16);",
              original,
              count=1,
          )

          updated, c2 = re.subn(
              r"mtk_poll_tx\(eth, budget\)",
              "mtk_poll_tx(eth, tx_budget)",
              updated,
              count=1,
          )

          updated, c3 = re.subn(
              r"if \(tx_done == budget\)\n(\s*)return budget;",
              r"if (tx_done == tx_budget)\n\1return budget;",
              updated,
              count=1,
          )

          if (c1, c2, c3) != (1, 1, 1):
              raise SystemExit(
                  f"TX budget patch failed: {c1,c2,c3}"
              )

          data = (
              data[:fn.start()]
              + updated
              + data[fn.end():]
          )

          with open(driver_path, "w", encoding="utf-8") as f:
              f.write(data)

          with open(header_path, "w", encoding="utf-8") as f:
              f.write(hdr)

          print("PASS: TX ring 1024")
          print("PASS: RX ring 512")
          print("PASS: FQ ring 2048")
          print("PASS: TX interrupt INT0")
          print("PASS: TX completion budget 16")
          PY

      - name: Validate ASIC V5-A driver invariants
        working-directory: openwrt
        run: |
          set -eu

          DRIVER="$(find build_dir/target-* \
            -type f \
            -path '*/drivers/net/ethernet/mediatek/mtk_eth_soc.c' \
            -print -quit)"

          HDR="$(find build_dir/target-* \
            -type f \
            -path '*/drivers/net/ethernet/mediatek/mtk_eth_soc.h' \
            -print -quit)"

          python3 - "$DRIVER" "$HDR" <<'PY'
          import re
          import sys

          data = open(sys.argv[1], encoding="utf-8").read()
          hdr = open(sys.argv[2], encoding="utf-8").read()

          soc = re.search(
              r"static const struct mtk_soc_data mt7621_data = \{.*?\n\};",
              data,
              re.S,
          )
          if not soc:
              raise SystemExit("Missing MT7621 data")

          block = soc.group(0)

          def get(pattern):
              m = re.search(pattern, block, re.S)
              return m.group(1) if m else None

          tx = get(
              r"\.tx\s*=\s*\{.*?\.dma_size\s*="
              r"\s*MTK_DMA_SIZE\(([^)]+)\)"
          )
          fq = get(
              r"\.tx\s*=\s*\{.*?\.fq_dma_size\s*="
              r"\s*MTK_DMA_SIZE\(([^)]+)\)"
          )
          rx = get(
              r"\.rx\s*=\s*\{.*?\.dma_size\s*="
              r"\s*MTK_DMA_SIZE\(([^)]+)\)"
          )

          assert (tx, fq, rx) == ("1K", "2K", "512")

          assert re.search(
              r"^#define\s+MTK_TX_DONE_INT\s+"
              r"MTK_TX_DONE_INT0\s*$",
              hdr,
              re.M,
          )

          fn = re.search(
              r"static int mtk_napi_tx"
              r"\(struct napi_struct \*napi, int budget\)"
              r"\n\{.*?\n\}",
              data,
              re.S,
          )

          assert fn, "Missing TX NAPI function"

          text = fn.group(0)

          for expected in (
              "int tx_budget = min(budget, 16);",
              "mtk_poll_tx(eth, tx_budget)",
              "if (tx_done == tx_budget)",
              "return budget;",
          ):
              assert expected in text, expected

          assert "mtk_poll_tx(eth, budget)" not in text
          assert "if (tx_done == budget)" not in text

          print("PASS: ASIC V5-A invariants")
          PY

      - name: Generate expanded Ethernet source audit
        working-directory: openwrt
        run: |
          set -eu

          DRIVER="$(find build_dir/target-* \
            -type f \
            -path '*/drivers/net/ethernet/mediatek/mtk_eth_soc.c' \
            -print -quit)"

          HDR="$(find build_dir/target-* \
            -type f \
            -path '*/drivers/net/ethernet/mediatek/mtk_eth_soc.h' \
            -print -quit)"

          REPORT=asic-v5a-source-audit.txt

          {
            echo "ASIC V5-A MT7621 SOURCE AUDIT"
            echo "Driver: $DRIVER"
            echo "Header: $HDR"

            echo
            echo "=== SOC RINGS ==="
            sed -n \
              '/static const struct mtk_soc_data mt7621_data/,/^};/p' \
              "$DRIVER"

            echo
            echo "=== TX NAPI FUNCTION ==="
            sed -n '/static int mtk_napi_tx/,/^}/p' \
              "$DRIVER"

            echo
            echo "=== TX POLLING / RECLAIM ==="
            grep -nEi \
              'mtk_poll_tx|tx_done|tx_free|tx_clean|reclaim|tx_irq' \
              "$DRIVER" "$HDR" || true

            echo
            echo "=== QUEUE STOP / WAKE ==="
            grep -nEi \
              'netif.*(stop|wake)|queue_stopped|tx_thresh|free_count' \
              "$DRIVER" "$HDR" || true

            echo
            echo "=== INTERRUPT MASK / REARM ==="
            grep -nEi \
              'irq|interrupt|int_mask|int_status|napi_complete|napi_schedule' \
              "$DRIVER" "$HDR" || true

            echo
            echo "=== DMA ORDERING ==="
            grep -nEi \
              'dma_wmb|dma_rmb|wmb|rmb|dma_map|dma_unmap|descriptor' \
              "$DRIVER" "$HDR" || true

            echo
            echo "=== NAPI / BUDGET / WEIGHTS ==="
            grep -nEi \
              'napi|budget|weight|poll' \
              "$DRIVER" "$HDR" || true

            echo
            echo "=== INTERRUPT COALESCING ==="
            grep -nEi \
              'coales|delay.*int|int.*delay|MTK_TX_DONE' \
              "$DRIVER" "$HDR" || true

          } > "$REPORT"

          echo "PASS: Expanded source audit generated"

      - name: Build OpenWrt firmware
        working-directory: openwrt
        run: |
          set -eu
          make -j"$(nproc)" V=s

      - name: Validate driver after build
        working-directory: openwrt
        run: |
          set -eu

          DRIVER="$(find build_dir/target-* \
            -type f \
            -path '*/drivers/net/ethernet/mediatek/mtk_eth_soc.c' \
            -print -quit)"

          HDR="$(find build_dir/target-* \
            -type f \
            -path '*/drivers/net/ethernet/mediatek/mtk_eth_soc.h' \
            -print -quit)"

          test -f "$DRIVER"
          test -f "$HDR"

          grep -q 'MTK_DMA_SIZE(1K)' "$DRIVER"
          grep -q 'MTK_TX_DONE_INT0' "$HDR"
          grep -q 'min(budget, 16)' "$DRIVER"

          echo "PASS: Driver changes survived compilation"

      - name: Extract and audit kernel configuration
        working-directory: openwrt
        run: |
          set -eu

          KCONFIG=""

          for cfg in $(find build_dir/target-* \
            -type f -name .config); do
            if grep -q '^CONFIG_MIPS=y' "$cfg" && \
               grep -q '^CONFIG_HZ=' "$cfg" && \
               ! grep -q '^CPTCFG_' "$cfg"; then
              KCONFIG="$cfg"
              break
            fi
          done

          test -n "$KCONFIG"

          cp "$KCONFIG" kernel-final.config

          grep -qx 'CONFIG_HZ=1000' kernel-final.config
          grep -qx 'CONFIG_HZ_1000=y' kernel-final.config
          grep -qx 'CONFIG_PREEMPT=y' kernel-final.config
          grep -qx 'CONFIG_PREEMPTION=y' kernel-final.config
          grep -qx 'CONFIG_SMP=y' kernel-final.config

          if grep -qx 'CONFIG_NO_HZ_FULL=y' kernel-final.config; then
            echo "ERROR: NO_HZ_FULL unexpectedly enabled"
            exit 1
          fi

          REPORT=asic-v5a-kernel-audit.txt

          {
            echo "ASIC V5-A FINAL KERNEL AUDIT"

            for pattern in \
              'CONFIG_HZ' \
              'CONFIG_PREEMPT' \
              'CONFIG_NO_HZ' \
              'CONFIG_RCU' \
              'CONFIG_SCHED' \
              'CONFIG_SMP' \
              'CONFIG_NR_CPUS' \
              'CONFIG_NET_SCHED' \
              'CONFIG_RPS' \
              'CONFIG_RFS' \
              'CONFIG_BQL' \
              'CONFIG_NET_RX_BUSY_POLL' \
              'CONFIG_DEBUG' \
              'CONFIG_LOCKDEP' \
              'CONFIG_FTRACE' \
              'CONFIG_TRACING' \
              'CONFIG_PROFILING' \
              'CONFIG_CPU_FREQ' \
              'CONFIG_CPU_IDLE' \
              'CONFIG_PM'
            do
              echo
              echo "=== $pattern ==="
              grep -E "^${pattern}|^# ${pattern}" \
                kernel-final.config || true
            done
          } > "$REPORT"

          echo "PASS: Kernel invariants validated"

      - name: Verify firmware and required packages
        working-directory: openwrt
        run: |
          set -eu

          IMAGE="$(find bin/targets/ramips/mt7621 \
            -type f \
            -name '*r6700-v2*squashfs-sysupgrade.bin' \
            -print -quit)"

          test -n "$IMAGE"
          test -f "$IMAGE"

          echo "Firmware: $IMAGE"

          for pkg in \
            tc-full kmod-sched-core kmod-sched \
            kmod-sched-ctinfo kmod-ifb kmod-veth \
            kmod-netem kmod-sched-cake kmod-sched-red \
            kmod-sched-pie kmod-sched-fq-pie \
            kmod-sched-flower kmod-sched-act-police \
            kmod-sched-connmark ip-full ethtool-full \
            conntrack jq coreutils-sleep lua
          do
            result="$(find bin -type f \
              -name "${pkg}-*.apk" -print -quit)"
            test -n "$result" || {
              echo "Missing APK: $pkg"
              exit 1
            }
          done

          echo "PASS: Firmware and packages exist"

      - name: Save build metadata
        working-directory: openwrt
        run: |
          set -eu

          OUT=bin/targets/ramips/mt7621

          cp .config "$OUT/openwrt-build.config"

          {
            echo "ASIC V5-A"
            echo "OpenWrt: v25.12.5"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Kernel: HZ1000 PREEMPT SMP"
            echo "MT7621 TX ring: 1024"
            echo "MT7621 RX ring: 512"
            echo "MT7621 FQ ring: 2048"
            echo "TX completion interrupt: INT0"
            echo "TX NAPI budget cap: 16"
            echo "Runtime tuning: not baked into firmware"
            echo "QoSmate: external installation"
            echo "LuCI: not explicitly included"
          } > "$OUT/build-info.txt"

      - name: Upload firmware and audits
        uses: actions/upload-artifact@v4
        with:
          name: R6700v2-ASIC-V5A-TX1024-RX512-TXBUDGET16
          path: |
            openwrt/bin/targets/ramips/mt7621/*r6700-v2*
            openwrt/bin/targets/ramips/mt7621/openwrt-build.config
            openwrt/bin/targets/ramips/mt7621/build-info.txt
            openwrt/bin/targets/ramips/mt7621/sha256sums
            openwrt/kernel-final.config
            openwrt/asic-v5a-source-audit.txt
            openwrt/asic-v5a-kernel-audit.txt
